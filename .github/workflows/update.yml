name: 每月更新資料並部署

on:
  schedule:
    # 每月 1 號 02:00 UTC（台灣時間 10:00）。開放資料本身更新頻率是不定期至每年，
    # 每月跑一次已經很充裕，不需要更密。
    - cron: '0 2 1 * *'
  workflow_dispatch: # 手動觸發，正式排程前先用這個測幾次
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # 拆成三步，這樣失敗時光看步驟名稱就知道是抓資料、建置還是驗證出問題——
      # 完整 log 需要 repo 管理權限才讀得到，但步驟結果是公開的。
      - name: 抓資料
        run: npm run fetch

      - name: 建置
        run: npx astro build

      - name: 驗證
        run: npm run verify

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ALONGSIDE_53F07 }}
          projectId: alongside-53f07
          channelId: live
